<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" fill="none">
    <defs>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#6b82ff" stop-opacity=".55" />
            <stop offset="1" stop-color="#2745cf" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#2745cf" />
            <stop offset="1" stop-color="#6b82ff" />
        </linearGradient>
        <radialGradient id="fade" cx="50%" cy="50%" r="50%">
            <stop offset=".35" stop-color="#fff" />
            <stop offset="1" stop-color="#000" />
        </radialGradient>
        <mask id="dotmask"><rect width="440" height="440" fill="url(#fade)" /></mask>
        <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="1" fill="#cfc9be" />
        </pattern>
        <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9" /></filter>
        <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="30" /></filter>
        <!-- One flat sheet, drawn in its own plane (180x230) and tilted by the group transform -->
        <g id="shadow"><rect x="14" y="14" width="180" height="230" rx="3" fill="#000" opacity=".22" filter="url(#blur)" /></g>
    </defs>

    <style>
        @media (prefers-reduced-motion: no-preference) {
            .float { animation: float 7s ease-in-out infinite; }
            .float-2 { animation: float 7s ease-in-out -2.5s infinite; }
            .cursor { animation: blink 1.1s steps(1) infinite; }
        }
        @keyframes float { 50% { transform: translateY(-7px); } }
        @keyframes blink { 50% { opacity: 0; } }
    </style>

    <!-- Dotted grid, fading out toward the edges -->
    <rect width="440" height="440" fill="url(#dots)" mask="url(#dotmask)" />

    <!-- Accent glow behind the stack, plus a ring on the ground plane -->
    <circle cx="220" cy="215" r="150" fill="url(#glow)" filter="url(#soft)" />
    <ellipse cx="220" cy="318" rx="165" ry="95" stroke="#2745cf" stroke-opacity=".55" stroke-dasharray="2 5" />
    <ellipse cx="220" cy="318" rx="120" ry="69" stroke="#2745cf" stroke-opacity=".3" />

    <!-- Bottom sheet -->
    <g transform="matrix(.866 .5 -.866 .5 241 146)">
        <use href="#shadow" />
        <rect width="180" height="230" rx="3" fill="#ebe7df" stroke="#d3cec4" />
        <path d="M16 24h90M16 40h148M16 52h120" stroke="#d3cec4" stroke-width="2" />
    </g>

    <!-- Middle sheet -->
    <g class="float-2">
        <g transform="matrix(.866 .5 -.866 .5 241 118)">
            <use href="#shadow" />
            <rect width="180" height="230" rx="3" fill="#f4f2ee" stroke="#d3cec4" />
            <rect x="16" y="24" width="60" height="8" fill="#b9b4aa" />
            <path d="M16 48h148M16 60h130M16 72h140M16 84h96" stroke="#d3cec4" stroke-width="2" />
            <rect x="16" y="108" width="148" height="70" fill="#ebe7df" stroke="#d3cec4" />
        </g>
    </g>

    <!-- Top sheet: a miniature document page -->
    <g class="float">
        <g transform="matrix(.866 .5 -.866 .5 241 90)">
            <use href="#shadow" />
            <rect width="180" height="230" rx="3" fill="#fbfaf8" stroke="#d3cec4" />
            <!-- Section number, heading, hairline -->
            <rect x="16" y="18" width="16" height="6" fill="url(#bar)" />
            <rect x="16" y="32" width="112" height="11" fill="#1a1917" />
            <path d="M16 54h148" stroke="#d3cec4" />
            <!-- Body lines -->
            <path d="M16 66h148M16 77h138M16 88h146M16 99h84" stroke="#b9b4aa" stroke-width="3" />
            <!-- Code block with coloured tokens -->
            <rect x="16" y="114" width="148" height="56" fill="#f4f2ee" stroke="#d3cec4" />
            <g stroke-width="4">
                <path d="M26 128h22" stroke="#2745cf" />
                <path d="M54 128h34" stroke="#b9b4aa" />
                <path d="M94 128h26" stroke="#b8791a" />
                <path d="M34 140h30" stroke="#1c7a52" />
                <path d="M70 140h46" stroke="#b9b4aa" />
                <path d="M26 152h18" stroke="#2745cf" />
                <path d="M50 152h40" stroke="#b9b4aa" />
            </g>
            <rect class="cursor" x="96" y="149" width="5" height="7" fill="#2745cf" />
            <!-- Callout in the accent -->
            <rect x="16" y="182" width="148" height="34" fill="#2745cf" fill-opacity=".12" />
            <rect x="16" y="182" width="3" height="34" fill="url(#bar)" />
            <path d="M28 194h92M28 205h64" stroke="#2745cf" stroke-width="3" stroke-opacity=".7" />
        </g>
    </g>
</svg>
