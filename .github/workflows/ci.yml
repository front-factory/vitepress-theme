name: CI

on:
  push:
    branches: [ "main", "develop", "beta" ]
  pull_request:
    branches: [ "main", "develop", "beta" ]

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    # Every version the published `engines` field promises. fail-fast is off so
    # a break on one version still reports the others.
    strategy:
      fail-fast: false
      matrix:
        node: [ 24 ]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install Dependencies
        run: npm ci --no-audit
        env:
          HUSKY: 0

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The package ships a compiled stylesheet: an empty or token-less file
      # would only be discovered after publishing.
      - name: Check the stylesheet
        run: |
          test -s dist/style.css
          grep -q -- '--ff-color-accent' dist/style.css

      # The playground consumes the theme the way a site does, so it is what
      # catches a component the build cannot resolve.
      - name: Build the playground
        run: npx vitepress build playground

  publish:
    runs-on: ubuntu-latest
    needs: [ build ]
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta') }}

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install Dependencies
        run: npm ci --no-audit
        env:
          HUSKY: 0

      - name: Release
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
